<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve dark/light before anything paints, so there's no flash of
         the wrong theme. Mirrors src/theme.js's own resolution logic -
         kept in sync by hand since this has to run before React (or any
         bundled JS) exists yet. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('caption-news-theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="google-site-verification" content="IpnzYtPcMbkzIQFjQjWhoRuDPPdGWNuiMiUYTZPOtNU" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Default/fallback title+description below. In production, server.js
         pattern-matches and rewrites this exact <title>+description pair
         per-route (adding OG/Twitter/canonical tags too) for crawlers and
         link-unfurlers that don't execute JavaScript. HTML comments don't
         survive CRA's build minification, so server.js can't rely on a
         comment marker here - it matches the tags themselves. Keep this
         <title> immediately followed by this exact description <meta> if
         you edit this file, or update the regex in server.js to match. -->
    <title>caption.news</title>
    <meta name="description" content="Headlines news.  News aggregator" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Oswald:wght@200..700&family=Redressed&display=swap" rel="stylesheet">

     <!-- <script src="https://widgets.365scores.com/main.js" async></script> -->

  </head>

    <div id="root"></div>

</html>
